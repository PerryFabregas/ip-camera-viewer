# =============================================================================
# CI compile test for ip_camera_viewer on ESP32-P4 — using youkorr/lvgl_9.5.
#
# Identical to ipcv_p4_test.yaml EXCEPT that the LVGL component (and its forked
# siblings) come from youkorr/lvgl_9.5@main instead of the LVGL bundled with
# ESPHome. This verifies that ip_camera_viewer compiles against *that* LVGL fork
# (LVGL 9.5.0 + ThorVG + ESP32-P4 PPA + custom lv_conf.h / build filter).
#
# Runtime/video is NOT validated here — only that the firmware builds.
# =============================================================================

esphome:
  name: ipcv-p4-lvglfork

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

logger:

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  slot: 1

wifi:
  ap:

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - platform: mipi_dsi
    id: tab5_display
    model: JC1060P470
    enable_pin: GPIO22

# Le fork définit USE_IMAGE / USE_FONT (lvgl_esphome.h inclut image.h / font.h).
# Lister image/font dans external_components ne suffit pas : un composant n'est
# COPIÉ (header présent) que s'il est réellement utilisé. On ajoute donc des
# blocs font:/image: minimalistes — comme dans une vraie config youkorr.
font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 14

image:
  - file: test_image.png
    id: test_img
    type: RGB565

lvgl:
  displays:
    - tab5_display
  pages:
    - id: main_page
      widgets:
        - canvas:
            id: cam_canvas
            width: 640
            height: 480

external_components:
  # LVGL (et composants forkés) depuis le dépôt de youkorr — remplace le LVGL
  # livré par ESPHome. C'est exactement ce que teste cette config.
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    # lvgl + image + font : le fork inclut image/image.h et font/font.h
    # (sous USE_IMAGE / USE_FONT), donc ces composants doivent être chargés —
    # exactement comme dans les configs de youkorr. button/key_provider sont
    # auto-chargés ; thorvg n'est pas un composant (lib incluse au build).
    components: [lvgl, image, font]
    refresh: always
  - source:
      type: local
      path: ../../components
    components: [ip_camera_viewer, h264_hp, esp_h264]

ip_camera_viewer:
  - id: cam_test
    protocol: rtsp
    url: "rtsp://user:pass@192.168.1.50:554/h264Preview_01_sub"
    canvas_id: cam_canvas
    width: 640
    height: 480
    update_interval: 100ms

switch:
  - platform: ip_camera_viewer
    name: "Cam test"
    camera_id: cam_test
