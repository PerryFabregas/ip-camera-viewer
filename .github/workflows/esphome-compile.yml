name: ESPHome compile (esp32-p4)

# Runs a full `esphome compile` for the ip_camera_viewer component on ESP32-P4.
# This catches packaging errors (include paths, prebuilt-lib linking) in CI,
# instead of on a tester's hardware. Runtime/video is NOT validated here.
#
# Three configs are built in parallel:
#   - ipcv_p4_test.yaml ........... LVGL bundled with ESPHome, components via `type: local`
#   - ipcv_p4_lvglfork_test.yaml .. LVGL from youkorr/lvgl_9.5 fork, components via `type: local`
#   - ipcv_p4_git_test.yaml ....... components pulled via `type: git` — the SAME path a
#                                   real user/tester hits. `type: local` hides bugs in
#                                   ESPHome's git-clone packaging (nested headers / prebuilt
#                                   lib not surviving the clone), so this config guards them.
#
# A separate `compile-dev` job builds the git config against ESPHome's *dev*
# branch (not the released version `pip install esphome` gives). A tester hit a
# header-not-found only on 2026.7.0-dev, so this guards behavior changes in the
# unreleased ESPHome that the released-version jobs above would miss.

on:
  push:
    branches: [claude/test-coverage-analysis-2viujv]
    paths:
      - 'components/**'
      - 'tests/esphome/**'
      - '.github/workflows/esphome-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - tests/esphome/ipcv_p4_test.yaml
          - tests/esphome/ipcv_p4_lvglfork_test.yaml
          - tests/esphome/ipcv_p4_git_test.yaml
    name: compile (${{ matrix.config }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache ESPHome / PlatformIO / IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.espressif
            ~/.cache/pip
          key: esphome-p4-${{ hashFiles(matrix.config) }}
          restore-keys: |
            esphome-p4-

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome
          esphome version

      - name: Validate config
        run: esphome config ${{ matrix.config }}

      - name: Compile firmware
        run: esphome compile ${{ matrix.config }}

  # Reproduce a tester's exact environment: ESPHome dev (2026.7.0-dev) + the
  # `type: git` config. Released ESPHome compiles fine; this guards the case
  # where the unreleased ESPHome changed git-component / build-flag handling.
  compile-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: compile (esphome dev, git source)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO / IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.espressif
            ~/.cache/pip
          key: esphome-p4-dev
          restore-keys: |
            esphome-p4-

      - name: Install ESPHome (dev branch)
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/esphome/esphome@dev
          esphome version

      - name: Validate config
        run: esphome config tests/esphome/ipcv_p4_git_test.yaml

      - name: Compile firmware
        run: esphome compile tests/esphome/ipcv_p4_git_test.yaml
