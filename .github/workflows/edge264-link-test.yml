name: edge264 link test (ESP32-P4, GCC)

# Valide que libedge264.a (compilé esp-clang) se LINKE dans un vrai build
# ESP32-P4 avec la toolchain GCC d'ESP-IDF — exactement ce dont un firmware
# ESPHome a besoin. C'est LE test qui révèle les symboles non résolus
# (pthread/sysconf/getrusage/clock_gettime...). On compile (idf.py build), pas
# d'exécution.

on:
  workflow_dispatch:
  push:
    paths:
      - "components/h264_hp/edge264/lib/esp32p4/libedge264.a"
      - "components/h264_hp/edge264/edge264.h"
      - "tests/edge264_link_test/**"
      - ".github/workflows/edge264-link-test.yml"

jobs:
  link-test:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build link test (esp32p4, GCC)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd tests/edge264_link_test
          idf.py set-target esp32p4
          idf.py build
          echo "=== libedge264.a linké avec succès dans un build GCC esp32p4 ==="
